<?xml version="1.0" encoding="UTF-8"?>
<!--
  Icône d'OMNIA : le faisceau du projecteur, signature visuelle du produit
  (voir DESIGN.md §5). Fond velours, faisceau ambre, lampe blanc chaud.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="glow" cx="34%" cy="50%" r="62%">
      <stop offset="0%" stop-color="#F2B441" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F2B441" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F2B441" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F2B441" stop-opacity="0.10"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect x="0" y="0" width="256" height="256" rx="56"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="256" height="256" fill="#120F14"/>
    <rect width="256" height="256" fill="url(#glow)"/>

    <!-- Le faisceau qui s'ouvre depuis la lampe vers l'écran. -->
    <path d="M78 128 L218 58 L218 198 Z" fill="url(#beam)"/>

    <!-- La lampe. -->
    <circle cx="78" cy="128" r="26" fill="#F2B441" opacity="0.30"/>
    <circle cx="78" cy="128" r="15" fill="#F3EFE6"/>

    <!-- Le trait du temps écoulé, sous le faisceau. -->
    <rect x="52" y="196" width="152" height="6" rx="3" fill="#2E2734"/>
    <rect x="52" y="196" width="86" height="6" rx="3" fill="#F2B441"/>
  </g>
</svg>
