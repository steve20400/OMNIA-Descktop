<?xml version="1.0" encoding="UTF-8"?>
<!--
  Icône d'OMNIA : le duo d'écrans. Un moniteur et un téléphone ambre reliés :
  le même lecteur sur l'ordinateur et sur le téléphone, et le téléphone qui
  pilote l'ordinateur (future télécommande mobile). Fond velours, contours
  blanc chaud, accent projecteur (voir DESIGN.md §1).
  tool/make_icon.py en tire l'icône Windows : tout changement ici s'y reporte.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="g-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#211A26"/><stop offset="1" stop-color="#120F14"/></linearGradient>
    <linearGradient id="g-beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F2B441" stop-opacity=".95"/><stop offset="1" stop-color="#F2B441" stop-opacity=".08"/></linearGradient>
  </defs>

  <!-- Le fond : carré aux coins doux, velours qui s'éclaircit vers le haut. -->
  <rect width="256" height="256" rx="56" fill="url(#g-bg)"/>

  <!-- L'ordinateur : moniteur, pied et socle. -->
  <rect x="28" y="50" width="172" height="118" rx="16" fill="#1C1720" stroke="#F3EFE6" stroke-width="9"/>
  <path d="M100 168 H128 L134 196 H94 Z" fill="#F3EFE6"/>
  <rect x="76" y="194" width="76" height="9" rx="4.5" fill="#F3EFE6"/>

  <!-- À l'écran, le faisceau qui s'ouvre depuis la lampe. -->
  <path d="M62 110 L158 76 L158 144 Z" fill="url(#g-beam)"/>
  <circle cx="62" cy="110" r="10" fill="#F3EFE6"/>

  <!-- Le téléphone ambre, devant le moniteur : son contour velours l'en détache. -->
  <rect x="160" y="100" width="66" height="116" rx="16" fill="#F2B441" stroke="#120F14" stroke-width="9"/>
  <rect x="171" y="116" width="44" height="70" rx="6" fill="#120F14"/>
  <path d="M186 137 L204 151 L186 165 Z" fill="#F2B441"/>
  <rect x="186" y="195" width="14" height="5" rx="2.5" fill="#120F14"/>

  <!-- Les ondes : le téléphone pilote l'ordinateur. -->
  <path d="M210 76 a24 24 0 0 0 -30 -12" fill="none" stroke="#F2B441" stroke-width="7" stroke-linecap="round"/>
  <path d="M221 70 a38 38 0 0 0 -46 -22" fill="none" stroke="#F2B441" stroke-width="7" stroke-linecap="round" opacity=".55"/>
</svg>
